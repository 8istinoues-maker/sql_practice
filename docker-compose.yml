services:
  postgres:
    image: postgres:16
    container_name: postgres-study
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pagila
    ports:
      - "5432:5432"
    volumes:
      - ./sample/pagila/pagila-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sample/pagila/pagila-data.sql:/docker-entrypoint-initdb.d/02-data.sql
      - ./sql:/sql
    restart: always